<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeBook</title>

    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RecipeBook" />
    <meta
      property="og:description"
      content="Find simple and delicious recipes with RecipeBook."
    />
    <meta property="og:url" content="https://your-site-url.com/" />
    <meta property="og:image" content="images/social-preview-image.png" />

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RecipeBook" />
    <meta
      name="twitter:description"
      content="Find simple and delicious recipes with RecipeBook."
    />
    <meta name="twitter:image" content="images/social-preview-image.png" />

    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  </head>
  <body>
    <header>
      <div class="site-branding">
        <img src="images/recipe-book.png" alt="RecipeBook logo" />
        <h1>RecipeBook</h1>
      </div>
    </header>

    <main>
      <section class="search-section">
        <form class="search-bar" action="#" method="get">
          <input type="text" name="q" placeholder="Find a recipe" />
          <button type="submit" aria-label="Search">
            <img src="images/search.svg" alt="" />
          </button>
        </form>
      </section>

      <section class="recipe-container">
        <article class="recipe-card">
          <div class="recipe-image">
            <img src="images/apple-crisp.jpg" alt="Apple crisp with ice cream" />
          </div>

          <div class="recipe-content">
            <p class="tag">dessert</p>
            <h2>Apple Crisp</h2>

            <span
              class="rating"
              role="img"
              aria-label="Rating: 4 out of 5 stars"
            >
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>

            <p class="description">
              This apple crisp recipe is a simple yet delicious fall dessert
              that's great served warm with vanilla ice cream.
            </p>
          </div>
        </article>
      </section>
    </main>

    <footer>
      <a
        href="https://www.flaticon.com/free-icons/recipe"
        title="recipe icons"
      >
        Recipe icons created by Freepik - Flaticon
      </a>

      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" /></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" /></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" /></a>
      </div>
    </footer>
  </body>
</html>
